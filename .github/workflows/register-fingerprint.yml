name: Register Fingerprint

on:
  workflow_dispatch:
    inputs:
      board_id:
        description: '主板指纹'
        required: true
        type: string

# 串行执行，防止并发写 registry.txt 造成 sha 冲突
concurrency:
  group: fingerprint-registry
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_WRITE_TOKEN }}

      - name: Register fingerprint
        env:
          BOARD_ID: ${{ github.event.inputs.board_id }}
        run: |
          set -e
          FILE="fingerprints/registry.txt"
          mkdir -p "$(dirname "$FILE")"
          touch "$FILE"
          # 兼容旧格式(纯指纹)与新格式(指纹|注册时间)：按 | 分隔取第一列做查重
          if ! awk -F'|' -v id="$BOARD_ID" '$1==id {found=1} END{exit !found}' "$FILE"; then
            TS="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            echo "$BOARD_ID|$TS" >> "$FILE"
            git config user.name "vimox-registry-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "$FILE"
            git commit -m "register fingerprint ${BOARD_ID:0:12}"
            git push
          fi
