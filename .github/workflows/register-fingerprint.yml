name: Register Fingerprint

on:
  workflow_dispatch:
    inputs:
      board_id:
        description: '主板指纹'
        required: true
        type: string

# 串行执行，防止并发写 registry.txt 造成 sha 冲突
concurrency:
  group: fingerprint-registry
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_WRITE_TOKEN }}

      - name: Register fingerprint
        env:
          BOARD_ID: ${{ github.event.inputs.board_id }}
        run: |
          set -e
          FILE="fingerprints/registry.txt"
          mkdir -p "$(dirname "$FILE")"
          touch "$FILE"
          if ! grep -qxF "$BOARD_ID" "$FILE"; then
            echo "$BOARD_ID" >> "$FILE"
            git config user.name "vimox-registry-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "$FILE"
            git commit -m "register fingerprint ${BOARD_ID:0:12}"
            git push
          fi
